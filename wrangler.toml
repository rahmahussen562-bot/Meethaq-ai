name = "meethaq-ai"
main = "cloudflare/worker.ts"
compatibility_date = "2026-10-06"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# The Worker delegates every non-/api request to ASSETS, so running it first is
# equivalent to a route list and remains compatible with Wrangler 3 and 4.
run_worker_first = true

# Configure MEETHAQ_API_ORIGIN as the persistent HTTPS origin of the hosted
# FastAPI service (for example, https://OWNER-meethaq-ai.hf.space).
